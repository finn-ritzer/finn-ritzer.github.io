<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden | Finn Ritzer</title>
  <!-- GitHub Pages zeigt diese Datei automatisch bei falschen Adressen.
       Die Pfade beginnen mit "/", damit CSS auch in Unterordnern gefunden wird. -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <section class="seitenkopf">
      <h1><span class="marker">Diese Seite gibt es nicht.</span></h1>
      <p class="einleitung">
        Vielleicht hat sich ein Tippfehler in die Adresse geschlichen,
        oder die Seite wurde verschoben.
      </p>
      <p><a href="/index.html">Zur Startseite</a></p>
    </section>
  </main>
</body>
</html>
